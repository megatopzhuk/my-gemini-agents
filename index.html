<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Multi-Agent Studio</title>
  <!-- Tailwind CSS (бесплатный CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js для рендеринга Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js для подсветки кода -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* Стили для контента внутри ответов AI */
    .prose pre { background: #1e293b; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
    .prose code { font-family: monospace; font-size: 0.9em; }
    .prose p { margin-bottom: 0.6em; }
    .prose ul { list-style: disc; margin-left: 1.5em; margin-bottom: 0.6em; }
    .prose ol { list-style: decimal; margin-left: 1.5em; margin-bottom: 0.6em; }
    .prose table { border-collapse: collapse; width: 100%; margin: 10px 0; }
    .prose th, .prose td { border: 1px solid #475569; padding: 6px 10px; text-align: left; }
    .prose th { background: #334155; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex overflow-hidden font-sans">

  <!-- ЛЕВАЯ ПАНЕЛЬ: Список агентов и глобальный API-ключ -->
  <aside class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 shrink-0">
    <div class="flex flex-col gap-4 overflow-hidden">
      <div class="flex items-center justify-between">
        <h1 class="text-lg font-bold tracking-tight text-blue-400">Gemini Agents</h1>
        <button id="addAgentBtn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-2.5 py-1.5 rounded-lg font-medium transition">
          + Новый агент
        </button>
      </div>

      <!-- Список независимых агентов -->
      <div id="agentsList" class="flex flex-col gap-1.5 overflow-y-auto pr-1"></div>
    </div>

    <!-- Нижний блок: API Key и Бэкап -->
    <div class="border-t border-slate-800 pt-3 flex flex-col gap-2.5 text-xs">
      <div>
        <label class="text-slate-400 block mb-1">Gemini API Key (Pro):</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." 
               class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-blue-500" />
      </div>
      <div class="flex gap-2">
        <button id="exportBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 py-1.5 rounded text-slate-300 transition">Экспорт JSON</button>
        <label class="flex-1 bg-slate-800 hover:bg-slate-700 py-1.5 rounded text-slate-300 text-center cursor-pointer transition">
          Импорт
          <input type="file" id="importInput" accept=".json" class="hidden" />
        </label>
      </div>
    </div>
  </aside>

  <!-- ЦЕНТРАЛЬНАЯ ОБЛАСТЬ: Чат с выбранным агентом -->
  <main class="flex-1 flex flex-col h-full bg-slate-950">
    <!-- Шапка текущего агента -->
    <header class="h-14 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/50 shrink-0">
      <div>
        <h2 id="currentAgentTitle" class="font-semibold text-base text-white">Агент</h2>
        <p id="currentAgentSubtitle" class="text-xs text-slate-400">gemini-4-argon</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="clearChatBtn" class="text-xs bg-slate-800 hover:bg-red-900/60 text-slate-300 hover:text-red-200 px-3 py-1.5 rounded-lg transition">
          Очистить историю
        </button>
        <button id="toggleSettingsBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition">
          Настройки агента
        </button>
      </div>
    </header>

    <!-- Лента сообщений -->
    <div id="chatContainer" class="flex-1 overflow-y-auto p-6 flex flex-col gap-4"></div>

    <!-- Поле ввода -->
    <div class="p-4 border-t border-slate-800 bg-slate-900/40 shrink-0">
      <form id="chatForm" class="max-w-4xl mx-auto flex gap-3">
        <textarea id="messageInput" rows="2" placeholder="Напишите задачу агенту... (Enter - отправить, Shift+Enter - перенос)"
                  class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 resize-none"></textarea>
        <button type="submit" id="sendBtn"
                class="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-medium px-5 rounded-xl transition self-end h-11">
          Отправить
        </button>
      </form>
    </div>
  </main>

  <!-- ПРАВАЯ ПАНЕЛЬ: Индивидуальные настройки текущего агента -->
  <aside id="settingsPanel" class="w-80 bg-slate-900 border-l border-slate-800 p-4 flex flex-col gap-4 overflow-y-auto shrink-0">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
      <h3 class="font-semibold text-sm text-slate-200">Параметры агента</h3>
      <button id="deleteAgentBtn" class="text-xs text-red-400 hover:text-red-300">Удалить</button>
    </div>

    <div>
      <label class="text-xs text-slate-400 block mb-1">Имя агента</label>
      <input type="text" id="agentNameInput" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-sm" />
    </div>

    <div>
      <label class="text-xs text-slate-400 block mb-1">Модель Gemini</label>
      <select id="agentModelSelect" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-sm">
        <option value="gemini-4-argon">gemini-4-argon (Флагман Pro)</option>
        <option value="gemini-4-hydrogen">gemini-4-hydrogen (Быстрая)</option>
        <option value="gemini-3.8-flash">gemini-3.8-flash</option>
        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
      </select>
    </div>

    <div>
      <label class="text-xs text-slate-400 block mb-1">Системная инструкция (Роль)</label>
      <textarea id="agentSystemPrompt" rows="7" placeholder="Опишите роль, правила и формат ответов..."
                class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-xs leading-relaxed"></textarea>
    </div>

    <div>
      <div class="flex justify-between text-xs text-slate-400 mb-1">
        <span>Температура (креативность)</span>
        <span id="tempValue">0.7</span>
      </div>
      <input type="range" id="agentTempInput" min="0" max="2" step="0.1" value="0.7" class="w-full accent-blue-500" />
    </div>

    <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded border border-slate-800">
      <div>
        <div class="text-xs font-medium text-slate-200">Поиск в Google (Grounding)</div>
        <div class="text-[11px] text-slate-400">Доступ агента к свежим данным в сети</div>
      </div>
      <input type="checkbox" id="agentSearchToggle" class="w-4 h-4 accent-blue-500" />
    </div>

    <div class="text-[11px] text-slate-500 mt-auto">
      Все настройки и переписки автоматически сохраняются в localStorage вашего браузера.
    </div>
  </aside>

  <script>
    // --- СОСТОЯНИЕ ПРИЛОЖЕНИЯ ---
    const STORAGE_KEY = 'gemini_multi_agent_studio_v1';

    const defaultAgents = [
      {
        id: 'agent-analyst',
        name: 'CRM-Аналитик',
        model: 'gemini-4-argon',
        systemInstruction: 'Ты - старший CRM и маркетинговый аналитик. Отвечай структурно, опирайся на цифры, когортный анализ, LTV и статистическую значимость. Избегай воды.',
        temperature: 0.2,
        useSearch: false,
        history: []
      },
      {
        id: 'agent-copywriter',
        name: 'Email-Копирайтер',
        model: 'gemini-4-hydrogen',
        systemInstruction: 'Ты - сильный коммерческий редактор и email-маркетолог. Пиши цепляющие темы писем, структурированный текст и сильные CTA.',
        temperature: 0.8,
        useSearch: true,
        history: []
      }
    ];

    let state = loadState();

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          console.error('Ошибка чтения localStorage', e);
        }
      }
      return {
        apiKey: '',
        activeAgentId: defaultAgents[0].id,
        agents: defaultAgents
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getActiveAgent() {
      return state.agents.find(a => a.id === state.activeAgentId) || state.agents[0];
    }

    // --- DOM ЭЛЕМЕНТЫ ---
    const agentsListEl = document.getElementById('agentsList');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const chatContainer = document.getElementById('chatContainer');
    const currentAgentTitle = document.getElementById('currentAgentTitle');
    const currentAgentSubtitle = document.getElementById('currentAgentSubtitle');
    const agentNameInput = document.getElementById('agentNameInput');
    const agentModelSelect = document.getElementById('agentModelSelect');
    const agentSystemPrompt = document.getElementById('agentSystemPrompt');
    const agentTempInput = document.getElementById('agentTempInput');
    const tempValue = document.getElementById('tempValue');
    const agentSearchToggle = document.getElementById('agentSearchToggle');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // --- РЕНДЕР ИНТЕРФЕЙСА ---
    function renderAll() {
      apiKeyInput.value = state.apiKey || '';
      renderAgentsList();
      renderActiveAgent();
    }

    function renderAgentsList() {
      agentsListEl.innerHTML = '';
      state.agents.forEach(agent => {
        const isActive = agent.id === state.activeAgentId;
        const btn = document.createElement('button');
        btn.className = `text-left px-3 py-2.5 rounded-lg transition flex flex-col gap-0.5 ${
          isActive ? 'bg-blue-600/20 border border-blue-500/50 text-white' : 'hover:bg-slate-800/70 text-slate-300 border border-transparent'
        }`;
        btn.innerHTML = `
          <span class="font-medium text-sm truncate">${escapeHtml(agent.name)}</span>
          <span class="text-[11px] text-slate-400 truncate">${agent.model} • Сообщений: ${agent.history.length}</span>
        `;
        btn.onclick = () => {
          state.activeAgentId = agent.id;
          saveState();
          renderAll();
        };
        agentsListEl.appendChild(btn);
      });
    }

    function renderActiveAgent() {
      const agent = getActiveAgent();
      if (!agent) return;

      currentAgentTitle.textContent = agent.name;
      currentAgentSubtitle.textContent = `${agent.model} | Temp: ${agent.temperature} ${agent.useSearch ? '| Google Search: ON' : ''}`;

      agentNameInput.value = agent.name;
      agentModelSelect.value = agent.model;
      agentSystemPrompt.value = agent.systemInstruction;
      agentTempInput.value = agent.temperature;
      tempValue.textContent = agent.temperature;
      agentSearchToggle.checked = !!agent.useSearch;

      renderChatHistory(agent);
    }

    function renderChatHistory(agent) {
      chatContainer.innerHTML = '';
      if (agent.history.length === 0) {
        chatContainer.innerHTML = `
          <div class="m-auto text-center max-w-md text-slate-500 text-sm">
            <p class="mb-1 text-slate-300 font-medium">Изолированная сессия агента «${escapeHtml(agent.name)}»</p>
            <p>История этого чата не пересекается с другими агентами. Задайте первый вопрос ниже.</p>
          </div>`;
        return;
      }

      agent.history.forEach(msg => {
        const isUser = msg.role === 'user';
        const wrapper = document.createElement('div');
        wrapper.className = `flex flex-col max-w-3xl ${isUser ? 'self-end items-end' : 'self-start items-start'}`;

        const bubble = document.createElement('div');
        bubble.className = `px-4 py-3 rounded-2xl text-sm leading-relaxed ${
          isUser 
            ? 'bg-blue-600 text-white rounded-br-sm whitespace-pre-wrap' 
            : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-sm prose'
        }`;

        if (isUser) {
          bubble.textContent = msg.text;
        } else {
          bubble.innerHTML = marked.parse(msg.text);
          bubble.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        }

        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);
      });

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // --- ВЗАИМОДЕЙСТВИЕ С GEMINI REST API ---
    async function sendMessageToGemini(userText) {
      if (!state.apiKey) {
        alert('Сначала вставьте ваш Gemini API Key в левом нижнем углу.');
        return;
      }

      const agent = getActiveAgent();
      agent.history.push({ role: 'user', text: userText });
      saveState();
      renderChatHistory(agent);
      renderAgentsList();

      // Индикатор загрузки
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'self-start bg-slate-900 border border-slate-800 text-slate-400 px-4 py-2.5 rounded-2xl text-xs animate-pulse';
      loadingDiv.textContent = `${agent.name} думает...`;
      chatContainer.appendChild(loadingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      sendBtn.disabled = true;

      try {
        // Формируем массив contents из истории конкретного агента
        const contents = agent.history.map(item => ({
          role: item.role === 'user' ? 'user' : 'model',
          parts: [{ text: item.text }]
        }));

        const requestBody = {
          contents: contents,
          generationConfig: {
            temperature: parseFloat(agent.temperature)
          }
        };

        if (agent.systemInstruction && agent.systemInstruction.trim()) {
          requestBody.systemInstruction = {
            parts: [{ text: agent.systemInstruction.trim() }]
          };
        }

        if (agent.useSearch) {
          requestBody.tools = [{ google_search: {} }];
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/${agent.model}:generateContent?key=${encodeURIComponent(state.apiKey)}`;
        
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || `HTTP Error ${response.status}`);
        }

        const replyText = data.candidates?.[0]?.content?.parts
          ?.map(p => p.text)
          .filter(Boolean)
          .join('\n') || 'Пустой ответ от модели.';

        agent.history.push({ role: 'model', text: replyText });
        saveState();
      } catch (err) {
        agent.history.push({ role: 'model', text: `**Ошибка API:** ${err.message}` });
        saveState();
      } finally {
        loadingDiv.remove();
        sendBtn.disabled = false;
        renderChatHistory(agent);
        renderAgentsList();
      }
    }

    // --- СОБЫТИЯ ---
    apiKeyInput.addEventListener('input', (e) => {
      state.apiKey = e.target.value.trim();
      saveState();
    });

    document.getElementById('addAgentBtn').addEventListener('click', () => {
      const newAgent = {
        id: 'agent-' + Date.now(),
        name: `Агент #${state.agents.length + 1}`,
        model: 'gemini-4-argon',
        systemInstruction: 'Ты - полезный ИИ-ассистент.',
        temperature: 0.7,
        useSearch: false,
        history: []
      };
      state.agents.push(newAgent);
      state.activeAgentId = newAgent.id;
      saveState();
      renderAll();
    });

    document.getElementById('deleteAgentBtn').addEventListener('click', () => {
      if (state.agents.length <= 1) {
        alert('Нельзя удалить последнего агента.');
        return;
      }
      if (!confirm('Удалить этого агента и всю его историю?')) return;
      state.agents = state.agents.filter(a => a.id !== state.activeAgentId);
      state.activeAgentId = state.agents[0].id;
      saveState();
      renderAll();
    });

    document.getElementById('clearChatBtn').addEventListener('click', () => {
      const agent = getActiveAgent();
      agent.history = [];
      saveState();
      renderAll();
    });

    document.getElementById('toggleSettingsBtn').addEventListener('click', () => {
      document.getElementById('settingsPanel').classList.toggle('hidden');
    });

    // Обновление настроек активного агента
    agentNameInput.addEventListener('input', (e) => {
      getActiveAgent().name = e.target.value || 'Без имени';
      saveState();
      renderAgentsList();
      currentAgentTitle.textContent = getActiveAgent().name;
    });

    agentModelSelect.addEventListener('change', (e) => {
      getActiveAgent().model = e.target.value;
      saveState();
      renderAll();
    });

    agentSystemPrompt.addEventListener('input', (e) => {
      getActiveAgent().systemInstruction = e.target.value;
      saveState();
    });

    agentTempInput.addEventListener('input', (e) => {
      getActiveAgent().temperature = parseFloat(e.target.value);
      tempValue.textContent = e.target.value;
      saveState();
      renderActiveAgent();
    });

    agentSearchToggle.addEventListener('change', (e) => {
      getActiveAgent().useSearch = e.target.checked;
      saveState();
      renderActiveAgent();
    });

    // Отправка формы
    document.getElementById('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;
      messageInput.value = '';
      sendMessageToGemini(text);
    });

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('chatForm').dispatchEvent(new Event('submit'));
      }
    });

    // Экспорт и импорт базы
    document.getElementById('exportBtn').addEventListener('click', () => {
      const exportData = { ...state, apiKey: '' }; // Не экспортируем ключ в открытый файл для безопасности
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gemini-agents-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    });

    document.getElementById('importInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (Array.isArray(imported.agents) && imported.agents.length > 0) {
            state.agents = imported.agents;
            state.activeAgentId = imported.activeAgentId || imported.agents[0].id;
            saveState();
            renderAll();
            alert('Агенты и история успешно восстановлены!');
          }
        } catch (err) {
          alert('Ошибка чтения JSON файла.');
        }
      };
      reader.readAsText(file);
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    renderAll();
  </script>
</body>
</html>
