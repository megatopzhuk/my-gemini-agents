<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gemini Multi-Agent Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js для рендеринга Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js для подсветки кода -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* Адаптивная высота с учетом мобильных браузеров */
    .app-height {
      height: 100vh;
      height: 100dvh;
    }
    /* Стили для контента внутри ответов AI */
    .prose pre { background: #1e293b; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-size: 0.85em; }
    .prose code { font-family: monospace; font-size: 0.9em; word-break: break-word; }
    .prose p { margin-bottom: 0.6em; }
    .prose p:last-child { margin-bottom: 0; }
    .prose ul { list-style: disc; margin-left: 1.3em; margin-bottom: 0.6em; }
    .prose ol { list-style: decimal; margin-left: 1.3em; margin-bottom: 0.6em; }
    .prose table { border-collapse: collapse; width: 100%; margin: 10px 0; display: block; overflow-x: auto; }
    .prose th, .prose td { border: 1px solid #475569; padding: 6px 8px; text-align: left; }
    .prose th { background: #334155; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 app-height flex overflow-hidden font-sans relative">

  <!-- ЗАТЕМНЕНИЕ ФОНА ДЛЯ МОБИЛЬНЫХ ШТОРОК -->
  <div id="mobileBackdrop" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-30 hidden lg:hidden transition-opacity"></div>

  <!-- ЛЕВАЯ ПАНЕЛЬ (Шторка на мобильных, фиксированная колонка на ПК) -->
  <aside id="leftSidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 transform -translate-x-full transition-transform duration-200 ease-in-out lg:static lg:translate-x-0 shrink-0">
    <div class="flex flex-col gap-3 overflow-hidden">
      <div class="flex items-center justify-between">
        <h1 class="text-lg font-bold tracking-tight text-blue-400">Gemini Agents</h1>
        <div class="flex items-center gap-1.5">
          <button id="addAgentBtn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-2.5 py-1.5 rounded-lg font-medium transition">
            + Новый
          </button>
          <button id="closeLeftBtn" class="lg:hidden text-slate-400 hover:text-white p-1.5 rounded-lg bg-slate-800">
            ✕
          </button>
        </div>
      </div>

      <!-- Список независимых агентов -->
      <div id="agentsList" class="flex flex-col gap-1.5 overflow-y-auto pr-1"></div>
    </div>

    <!-- Нижний блок: API Key и Бэкап -->
    <div class="border-t border-slate-800 pt-3 flex flex-col gap-2.5 text-xs">
      <div>
        <label class="text-slate-400 block mb-1">Gemini API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." 
               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-slate-200 focus:outline-none focus:border-blue-500" />
      </div>
      <div class="flex gap-2">
        <button id="exportBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 py-2 rounded-lg text-slate-300 transition">Экспорт JSON</button>
        <label class="flex-1 bg-slate-800 hover:bg-slate-700 py-2 rounded-lg text-slate-300 text-center cursor-pointer transition">
          Импорт
          <input type="file" id="importInput" accept=".json" class="hidden" />
        </label>
      </div>
    </div>
  </aside>

  <!-- ЦЕНТРАЛЬНАЯ ОБЛАСТЬ: Чат с выбранным агентом -->
  <main class="flex-1 flex flex-col h-full min-w-0 bg-slate-950">
    <!-- Адаптивная шапка -->
    <header class="h-14 border-b border-slate-800 px-3 sm:px-5 flex items-center justify-between gap-2 bg-slate-900/70 shrink-0">
      <div class="flex items-center gap-2.5 min-w-0">
        <!-- Кнопка открытия списка агентов на мобильных -->
        <button id="openLeftBtn" class="lg:hidden p-2 -ml-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 shrink-0" title="Агенты и ключ">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

        <div class="min-w-0">
          <h2 id="currentAgentTitle" class="font-semibold text-sm sm:text-base text-white truncate">Агент</h2>
          <p id="currentAgentSubtitle" class="text-[11px] sm:text-xs text-slate-400 truncate">gemini-3.8-flash</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="clearChatBtn" class="text-xs bg-slate-800 hover:bg-red-900/60 text-slate-300 hover:text-red-200 px-2.5 py-1.5 rounded-lg transition" title="Очистить историю">
          <span class="hidden sm:inline">Очистить</span>
          <span class="sm:hidden">🗑️</span>
        </button>
        <button id="toggleSettingsBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1">
          <span>⚙️</span>
          <span class="hidden sm:inline">Настройки</span>
        </button>
      </div>
    </header>

    <!-- Лента сообщений -->
    <div id="chatContainer" class="flex-1 overflow-y-auto px-3 py-4 sm:p-6 flex flex-col gap-3 sm:gap-4"></div>

    <!-- Поле ввода -->
    <div class="p-2.5 sm:p-4 border-t border-slate-800 bg-slate-900/60 shrink-0">
      <form id="chatForm" class="max-w-4xl mx-auto flex items-end gap-2">
        <textarea id="messageInput" rows="1" placeholder="Сообщение агенту..."
                  class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 resize-none max-h-36 overflow-y-auto"></textarea>
        <button type="submit" id="sendBtn"
                class="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-medium px-3.5 sm:px-5 h-10 rounded-xl transition shrink-0 flex items-center justify-center">
          <span class="hidden sm:inline text-sm">Отправить</span>
          <svg class="w-5 h-5 sm:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </form>
    </div>
  </main>

  <!-- ПРАВАЯ ПАНЕЛЬ: Индивидуальные настройки текущего агента -->
  <aside id="settingsPanel" class="fixed inset-y-0 right-0 z-40 w-80 max-w-[85vw] bg-slate-900 border-l border-slate-800 p-4 flex flex-col gap-4 overflow-y-auto transform translate-x-full transition-transform duration-200 ease-in-out lg:static lg:translate-x-0 shrink-0">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
      <h3 class="font-semibold text-sm text-slate-200">Параметры агента</h3>
      <div class="flex items-center gap-3">
        <button id="deleteAgentBtn" class="text-xs text-red-400 hover:text-red-300">Удалить</button>
        <button id="closeRightBtn" class="lg:hidden text-slate-400 hover:text-white p-1 rounded bg-slate-800 text-xs">✕</button>
      </div>
    </div>

    <div>
      <label class="text-xs text-slate-400 block mb-1">Имя агента</label>
      <input type="text" id="agentNameInput" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-sm" />
    </div>

    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs text-slate-400">Модель Gemini</label>
        <button id="refreshModelsBtn" type="button" class="text-[11px] text-blue-400 hover:underline">Обновить список</button>
      </div>
      <select id="agentModelSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-sm">
        <option value="gemini-3.8-flash">gemini-3.8-flash</option>
        <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
        <option value="gemini-4-hydrogen">gemini-4-hydrogen</option>
        <option value="gemini-4-argon">gemini-4-argon</option>
      </select>
    </div>

    <div>
      <label class="text-xs text-slate-400 block mb-1">Системная инструкция (Роль)</label>
      <textarea id="agentSystemPrompt" rows="6" placeholder="Опишите роль, правила и формат ответов..."
                class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs leading-relaxed"></textarea>
    </div>

    <div>
      <div class="flex justify-between text-xs text-slate-400 mb-1">
        <span>Температура (креативность)</span>
        <span id="tempValue">0.7</span>
      </div>
      <input type="range" id="agentTempInput" min="0" max="2" step="0.1" value="0.7" class="w-full accent-blue-500 h-2" />
    </div>

    <div class="flex items-center justify-between bg-slate-950 p-3 rounded-lg border border-slate-800">
      <div class="pr-2">
        <div class="text-xs font-medium text-slate-200">Поиск в Google (Grounding)</div>
        <div class="text-[11px] text-slate-400">Может требовать платный биллинг API</div>
      </div>
      <input type="checkbox" id="agentSearchToggle" class="w-5 h-5 accent-blue-500 shrink-0" />
    </div>

    <div class="text-[11px] text-slate-500 mt-auto pt-2">
      Данные хранятся локально в памяти вашего браузера.
    </div>
  </aside>

  <script>
    // --- СОСТОЯНИЕ ПРИЛОЖЕНИЯ ---
    const STORAGE_KEY = 'gemini_multi_agent_studio_v1';

    const defaultAgents = [
      {
        id: 'agent-analyst',
        name: 'CRM-Аналитик',
        model: 'gemini-3.8-flash',
        systemInstruction: 'Ты - старший CRM и маркетинговый аналитик. Отвечай структурно, опирайся на цифры, когортный анализ, LTV и статистическую значимость. Избегай воды.',
        temperature: 0.2,
        useSearch: false,
        history: []
      },
      {
        id: 'agent-copywriter',
        name: 'Email-Копирайтер',
        model: 'gemini-3.8-flash',
        systemInstruction: 'Ты - сильный коммерческий редактор и email-маркетолог. Пиши цепляющие темы писем, структурированный текст и сильные CTA.',
        temperature: 0.8,
        useSearch: false,
        history: []
      }
    ];

    let state = loadState();

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          console.error('Ошибка чтения localStorage', e);
        }
      }
      return {
        apiKey: '',
        activeAgentId: defaultAgents[0].id,
        agents: defaultAgents
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getActiveAgent() {
      return state.agents.find(a => a.id === state.activeAgentId) || state.agents[0];
    }

    // --- DOM ЭЛЕМЕНТЫ ---
    const agentsListEl = document.getElementById('agentsList');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const chatContainer = document.getElementById('chatContainer');
    const currentAgentTitle = document.getElementById('currentAgentTitle');
    const currentAgentSubtitle = document.getElementById('currentAgentSubtitle');
    const agentNameInput = document.getElementById('agentNameInput');
    const agentModelSelect = document.getElementById('agentModelSelect');
    const agentSystemPrompt = document.getElementById('agentSystemPrompt');
    const agentTempInput = document.getElementById('agentTempInput');
    const tempValue = document.getElementById('tempValue');
    const agentSearchToggle = document.getElementById('agentSearchToggle');
    const messageInput = document.getElementById('messageInput');
    const send
